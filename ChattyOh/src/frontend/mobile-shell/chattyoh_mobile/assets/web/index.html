<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ChattyOh Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5BD9">
<style>
:root{--bg:#F1F7FE;--sf:#fff;--s2:#E8F2FD;--tx:#0B1F3F;--mu:#587092;--bd:#D3E3F6;--p:#0A5BD9;--p2:#12B5FF;--dp:#0B3C8C;--ok:#12a36b;--wr:#e59a0b;--er:#d93a4a;--r:12px;box-sizing:border-box}
:root[data-theme=dark]{--bg:#050E1D;--sf:#0B1A31;--s2:#10223D;--tx:#E6F1FF;--mu:#8CA6C8;--bd:#1B3356;--p:#2F8DFF;--p2:#35C4FF;--dp:#1B4FA8}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;background:linear-gradient(90deg,var(--dp),var(--p) 60%,var(--p2));color:#fff;flex:none}
.top button,.top select,.top input{color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand img{width:40px;height:40px;background:#fff;border-radius:50%;padding:1px;object-fit:contain}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;position:relative;font-size:16px}
.ib:hover,.tab:hover{background:rgba(255,255,255,.18)}
.srch{flex:0 1 220px;background:rgba(255,255,255,.16);border-radius:9px;padding:0 10px;height:34px;border:1px solid rgba(255,255,255,.25)}
.srch::placeholder{color:#e3f1ff}.srch:focus{outline:2px solid #fff}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:9px;height:34px;padding:0 8px}
.pill option{color:#000}
.badge{position:absolute;top:2px;right:2px;background:#ff4d5e;border-radius:9px;font-size:9px;padding:0 4px;line-height:14px}
.sw{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.3);position:relative;flex:none}
.sw::after{content:"☀️";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;font-size:12px;display:grid;place-items:center;transition:.2s}
[data-theme=dark] .sw::after{content:"🌙";transform:translateX(18px);background:#0B1A31}
.tabs{display:flex;gap:2px;background:var(--dp);padding:0 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.tab{color:#dbeaff;padding:9px 12px;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:600;font-size:13px;border-bottom:3px solid transparent}
.tab.on{color:#fff;background:rgba(255,255,255,.14);border-bottom-color:var(--p2)}
.body{flex:1;display:flex;min-height:0}
aside{width:264px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;flex:none;padding:8px;transition:width .2s}
.gh{width:100%;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);padding:8px 8px 4px;display:flex;justify-content:space-between}
.gh i{font-style:normal;transition:.2s}.grp.cl .gh i{transform:rotate(-90deg)}.grp.cl .gb{display:none}
.row{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:9px;text-align:left}
.row:hover{background:var(--s2)}.row.on{background:var(--p);color:#fff}
.row .ch{margin-left:auto;font-size:11px;opacity:.6;transition:.2s}.it.op .ch{transform:rotate(90deg)}
.sub{display:none;margin:2px 0 4px 18px;padding-left:10px;border-left:2px solid var(--bd)}.it.op .sub{display:block}
.sub button{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;color:var(--mu);font-size:13px}
.sub button:hover,.sub button.on{background:var(--s2);color:var(--p)}
aside.mini{width:60px}aside.mini .gh,aside.mini .row b,aside.mini .ch,aside.mini .sub{display:none}aside.mini .row{justify-content:center}aside.mini .grp.cl .gb{display:block}
main{flex:1;overflow-y:auto;padding:20px;min-width:0}
.ctx{width:280px;background:var(--sf);border-left:1px solid var(--bd);overflow-y:auto;padding:12px;flex:none}
.ctx.h{display:none}
h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:22px 0 10px}h3{margin:0;font-size:14px}
.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mc{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}.mc:hover{transform:translateY(-2px);border-color:var(--p2);box-shadow:0 6px 18px rgba(10,91,217,.15)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--p),var(--p2))}
.stat b{font-size:22px;display:block;color:var(--p)}
.btn{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:8px 13px;border-radius:9px;font-weight:600}
.btn.o{background:var(--s2);color:var(--p);border:1px solid var(--bd)}
.btn:hover{filter:brightness(1.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px}
.cmd{display:flex;gap:8px;margin-top:12px}.cmd input,.comp textarea{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
.hero{background:linear-gradient(120deg,var(--dp),var(--p) 55%,var(--p2));color:#fff;border:0}
.hero .cmd input{background:rgba(255,255,255,.95);color:#0B1F3F}
.hero .btn{background:#fff;color:var(--p)}
.chat{display:flex;flex-direction:column;height:calc(100% - 4px);max-width:860px;margin:0 auto}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.m{max-width:78%;padding:10px 13px;border-radius:14px;background:var(--sf);border:1px solid var(--bd)}.m.u{align-self:flex-end;background:var(--p);color:#fff;border:0}
.comp{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px}.comp textarea{width:100%;resize:none;height:56px}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}.tools .btn{margin-left:auto}
.bot{height:150px;background:var(--sf);border-top:1px solid var(--bd);flex:none;display:flex;flex-direction:column}.bot.h{height:34px}.bot.h .bc{display:none}
.bt{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--bd);overflow-x:auto}.bt button{padding:7px 11px;font-size:12px;color:var(--mu);white-space:nowrap;border-bottom:2px solid transparent}.bt button.on{color:var(--p);border-color:var(--p)}
.bc{flex:1;overflow:auto;padding:8px 14px;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mu)}
.tag{padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600}.ok{background:#12a36b22;color:var(--ok)}.wr{background:#e59a0b22;color:var(--wr)}.er{background:#d93a4a22;color:var(--er)}
.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.s{opacity:1}
.cv{font-size:10px;opacity:.75}
.dd,.pop{display:none;position:fixed;z-index:40;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 40px rgba(5,20,60,.3);padding:8px;max-height:72vh;overflow:auto}
.dd.s,.pop.s{display:block}.dd{min-width:240px;max-width:94vw}.dd.w{width:min(520px,94vw)}
.dd h4{margin:2px 8px 6px;font-size:11px;letter-spacing:.06em;color:var(--mu)}
.dg{display:grid;grid-template-columns:1fr;gap:2px}.dd.w .dg{grid-template-columns:1fr 1fr}
.dg button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:8px}.dg button:hover{background:var(--s2);color:var(--p)}
.pop{top:58px;left:8px;width:310px;max-width:94vw}
.pa{display:flex;gap:6px;margin-bottom:8px}.pa button{flex:1;padding:8px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);font-weight:600;font-size:13px}.pa button:hover{background:var(--p);color:#fff}
.pop details{border-top:1px solid var(--bd)}.pop summary{padding:9px 6px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}.pop summary::after{content:"▾";opacity:.6}.pop details[open] summary::after{content:"▴"}
@media(max-width:860px){aside{position:fixed;left:0;top:96px;bottom:0;z-index:20;transform:translateX(-100%);transition:.2s;width:264px!important;box-shadow:4px 0 20px rgba(0,0,0,.3)}aside.open{transform:none}.ctx{display:none}.srch,.hide-m{display:none}main{padding:14px}.bot{height:120px}.m{max-width:92%}}
</style></head><body>
<header class="top">
 <button class="ib" id="menu" aria-label="Toggle sidebar">☰</button>
 <a class="brand" href="#home" style="color:#fff;text-decoration:none"><img id="lg" alt="ChattyOh logo"><span>ChattyOh <small style="font-weight:400;opacity:.8">Inc</small></span></a>
 <input class="srch" id="gs" placeholder="🔍 Search projects, agents, docs…" aria-label="Global search">
 <span style="flex:1"></span>
 <select class="pill hide-m" aria-label="Workspace"><option>👤 Personal</option><option>👥 Team</option><option>🏢 Organization</option></select>
 <select class="pill hide-m" aria-label="Model"><option>🧠 Auto (best)</option><option>Claude</option><option>GPT</option><option>Gemini</option><option>Custom model</option></select>
 <button class="ib" data-t="Quick actions" title="Quick Actions">⚡</button>
 <button class="ib" data-t="3 agents running · 1 awaiting approval" title="Agent Activity">🤖<span class="badge">3</span></button>
 <button class="ib" data-t="No new notifications" title="Notifications">🔔<span class="badge">2</span></button>
 <button class="ib hide-m" id="inst" title="Install app" style="display:none">⬇️</button>
 <button class="sw" id="theme" role="switch" aria-label="Dark mode" title="Dark mode"></button>
 <button class="ib" id="ctxb" title="Context panel">▥</button>
 <button class="ib" data-t="Profile & subscription" style="background:rgba(255,255,255,.2)">👤</button>
</header>
<nav class="tabs" id="tabs" aria-label="Modes"></nav><div class="dd" id="dd"></div><div class="pop" id="hm"></div>
<div class="body"><aside id="sb" aria-label="Main navigation"></aside><main id="mn"></main><div class="ctx" id="cx"></div></div>
<section class="bot" id="bot"><div class="bt" id="bt"></div><div class="bc" id="bc"></div></section>
<div class="toast" id="ts"></div>

function cmd(t){const s=t.trim();let m;if(!s)return null;
 if(/^\/?help$/i.test(s))return HELP;if(/^\/status$/i.test(s))return statusTxt();
 if(m=s.match(/^\/list\s+(\w+)/i)){const c=ALIAS[m[1].toLowerCase()];return c?`${S[c].t} (${DB.all(c).length}):\n`+DB.all(c).slice(0,10).map(r=>'• '+lbl(r)).join('\n'):HELP}

 if(m=s.match(/^\/build\s+(.+)/i))return make('project',m[1].trim());
 return null}

</script><script id="mb">/* ChattyOh mobile bridge — Flutter (window.Native channel) or plain browser (simulated). Loaded AFTER the app engine. */
(()=>{
