<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ChattyOh Mobile — Phone Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#e9f1fb;--tx:#0B1F3F}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
button,select{font:inherit;padding:7px 12px;border-radius:9px;border:1px solid #b9cfee;background:#fff;color:inherit;cursor:pointer}button:hover{background:#0A5BD9;color:#fff}
.phone{background:#0b0f19;border-radius:44px;padding:12px;box-shadow:0 24px 70px rgba(5,30,80,.45);position:relative;transition:width .2s,height .2s}
.phone iframe{width:100%;height:100%;border:0;border-radius:32px;background:#fff;display:block}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#0b0f19;border-radius:0 0 14px 14px;z-index:2;pointer-events:none}
.hint{max-width:640px;text-align:center;color:#587092;font-size:13px}
</style></head><body>
<div class="bar">
 <select id="dev" aria-label="Device"><option value="393x852">iPhone 15 (393×852)</option><option value="412x915">Pixel 8 (412×915)</option><option value="360x640">Small Android (360×640)</option><option value="820x1180">Tablet (820×1180)</option></select>
 <button id="rot">⟳ Rotate</button><button id="th">🌓 Dark / light</button><button id="back">◀ Android back</button><button id="rl">↻ Reload</button><span id="st" style="opacity:.7"></span>
</div>
<div class="phone" id="ph"><div class="notch"></div><iframe id="fr" src="chattyoh-mobile.html" title="ChattyOh mobile app"></iframe></div>
<p class="hint">Keep this file in the same folder as <b>chattyoh-mobile.html</b>. Edit that file, then press Reload here. The page runs in its simulated (browser) mode: downloads are normal browser downloads, and the AI uses a test key stored in the browser.</p>
<script>
const $=s=>document.querySelector(s);let land=false,dark=false;
function size(){const [w,h]=$('#dev').value.split('x').map(Number),W=land?h:w,H=land?w:h,k=Math.min(1,(innerHeight-130)/(H+24));
 $('#ph').style.width=(W+24)*k+'px';$('#ph').style.height=(H+24)*k+'px';$('#fr').style.width=W+'px';$('#fr').style.height=H+'px';
 $('#fr').style.transform=`scale(${k})`;$('#fr').style.transformOrigin='0 0';$('#fr').parentElement.style.overflow='hidden'}
$('#dev').onchange=size;$('#rot').onclick=()=>{land=!land;size()};addEventListener('resize',size);size();
$('#th').onclick=()=>{dark=!dark;$('#fr').contentWindow.postMessage({type:'setTheme',dark},'*')};
$('#back').onclick=()=>$('#fr').contentWindow.postMessage({type:'back'},'*');
$('#rl').onclick=()=>$('#fr').contentWindow.location.reload();
addEventListener('message',e=>{const d=e.data||{};if(d.type==='backResult'){$('#st').textContent=d.handled?'Back handled by the app':'Back at Home → the real app would exit';setTimeout(()=>$('#st').textContent='',2500)}if(d.type==='theme')dark=d.dark});
</script></body></html>
