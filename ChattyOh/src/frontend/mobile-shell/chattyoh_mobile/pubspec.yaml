name: chattyoh_mobile
description: ChattyOh Inc - agentic AI workspace (Android and iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  file_picker: ^8.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
