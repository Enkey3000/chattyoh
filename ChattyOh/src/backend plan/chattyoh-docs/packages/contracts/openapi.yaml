      tags:
      - Projects
      x-srs:
      - SRS-FR-WS-003
      - SRS-NFR-INT-01
      x-sec:
      - SEC-C-02
      - SEC-C-06
      x-min-role: developer
      parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Success
          content:
