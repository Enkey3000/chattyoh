  /v1/workspaces/{workspaceId}/projects/{projectId}/actions/advance:
    post:
      operationId: advanceProject
      summary: Advance the lifecycle stage; refused by gates
      tags:
      - Projects
      x-srs:
      - SRS-FR-WS-004
      - SRS-NFR-INT-01
      x-sec:
      - SEC-C-02
      x-min-role: developer
      parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '409':
          description: Refused by a gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
