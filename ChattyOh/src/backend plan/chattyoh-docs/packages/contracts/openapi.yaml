openapi: 3.1.0
info:
  title: ChattyOh API
  version: 0.1.0
  description: Contract for the ChattyOh platform. Every operation lists the requirements it implements (x-srs) and the security
    controls it relies on (x-sec). Tenant and user come from the session, never from the request body. Gated fields (project
    stage/status, document status, agent status) are read-only and change only through action endpoints.
servers:
- url: https://api.example.com
  description: Replace with the real API host
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: Identity
- name: Workspaces
- name: Projects
- name: Tasks
- name: Chat
- name: Documents
- name: Agents
- name: Approvals
- name: Audit
- name: Import/Export
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Current user and memberships
      tags:
      - Identity
      x-srs:
      - SRS-FR-AUTH-001
      x-sec:
      - SEC-C-01
      x-min-role: any
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags:
      - Identity
      x-srs:
      - SRS-FR-AUTH-003
      x-sec:
      - SEC-C-01
      x-min-role: any
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      tags:
      - Identity
      x-srs:
      - SRS-FR-AUTH-003
      x-sec:
      - SEC-C-01
      - SEC-C-12
      x-min-role: any
      parameters:
      - $ref: '#/components/parameters/sessionId'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/mfa/enrollments:
    post:
      operationId: enrollMfa
      summary: Start MFA enrollment (requires recent authentication)
      tags:
      - Identity
      x-srs:
      - SRS-FR-AUTH-002
      x-sec:
      - SEC-C-01
      x-min-role: any
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      tags:
      - Workspaces
      x-srs:
      - SRS-FR-WS-001
      x-sec:
      - SEC-C-03
      x-min-role: any
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags:
      - Workspaces
      x-srs:
      - SRS-FR-WS-001
      x-sec:
      - SEC-C-03
      x-min-role: any
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/workspaces/{workspaceId}:
    patch:
      operationId: renameWorkspace
