        data:
          type: object
      additionalProperties: false
      required:
      - schemaVersion
      - exportedAt
      - data
    ImportRequest:
      type: object
      properties:
        bundle:
          $ref: '#/components/schemas/ExportBundle'
        dryRun:
          type: boolean
      additionalProperties: false
      required:
      - bundle
    ImportPreview:
      type: object
      properties:
        schemaVersion:
          type: integer
        counts:
          type: object
        conflicts:
          type: array
          items:
            type: string
        applied:
          type: boolean
      additionalProperties: false
      required:
      - schemaVersion
      - counts
      - conflicts
      - applied
    Backup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schemaVersion:
          type: integer
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
      required:
      - id
      - schemaVersion
      - sizeBytes
      - createdAt
  responses:
    BadRequest:
      description: Invalid input (schema, size or unknown field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted (role, tenant or step-up required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (also returned for other tenants' IDs)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit or quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
