<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">ChattyOh streamed message flow</title>
  <desc id="desc">A client creates a message, the API assigns a reply ID, the LLM gateway streams SSE events, and cancellation is sent through a separate REST request.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#466486"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17324f}.title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:700}.sub{font-size:14px}.box{fill:#fff;stroke:#77a2d4;stroke-width:2;rx:12}.line{stroke:#466486;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}</style>
  </defs>
  <rect width="1200" height="540" fill="#f5f9fe"/>
  <text x="50" y="55" class="title">ChattyOh — streamed chat reply (planned SSE contract)</text>
  <rect x="55" y="105" width="210" height="82" class="box"/><text x="160" y="139" text-anchor="middle" class="label">Client</text><text x="160" y="164" text-anchor="middle" class="sub">User message + reply ID</text>
  <rect x="350" y="105" width="210" height="82" class="box"/><text x="455" y="139" text-anchor="middle" class="label">Chat API</text><text x="455" y="164" text-anchor="middle" class="sub">Persist / authorize</text>
  <rect x="645" y="105" width="210" height="82" class="box"/><text x="750" y="139" text-anchor="middle" class="label">LLM gateway</text><text x="750" y="164" text-anchor="middle" class="sub">Policy / quota / provider</text>
  <rect x="940" y="105" width="210" height="82" class="box"/><text x="1045" y="139" text-anchor="middle" class="label">LLM provider</text><text x="1045" y="164" text-anchor="middle" class="sub">Completion chunks</text>
  <path d="M265 146 H342" class="line"/><path d="M560 146 H637" class="line"/><path d="M855 146 H932" class="line"/>
  <text x="303" y="130" text-anchor="middle" class="sub">POST</text><text x="598" y="130" text-anchor="middle" class="sub">prompt</text><text x="893" y="130" text-anchor="middle" class="sub">request</text>
  <path d="M932 219 H855" class="line"/><path d="M637 219 H560" class="line"/><text x="893" y="205" text-anchor="middle" class="sub">tokens</text><text x="598" y="205" text-anchor="middle" class="sub">validated</text>
  <path d="M350 285 H265" class="line"/><text x="307" y="272" text-anchor="middle" class="sub">SSE events with reply ID</text>
  <rect x="55" y="322" width="1095" height="74" class="box"/>
  <text x="602" y="352" text-anchor="middle" class="label">Client appends chunks only to the matching pending reply</text>
  <text x="602" y="378" text-anchor="middle" class="sub">A concurrent send is visibly refused while a reply is pending (or queued by a future decision).</text>
  <path d="M160 187 V278 H55" class="line dashed"/>
  <rect x="55" y="435" width="1095" height="62" fill="#fff7e8" stroke="#d7a643" stroke-width="2" rx="10"/>
  <text x="602" y="462" text-anchor="middle" class="label">Cancel uses a separate REST action</text>
  <text x="602" y="484" text-anchor="middle" class="sub">The API cancels upstream work and marks that same reply ID as stopped.</text>
</svg>
